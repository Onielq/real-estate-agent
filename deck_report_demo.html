<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project Report — Demo</title>
<style>
body { margin: 0; background: #d9d9d9; font-family: -apple-system, sans-serif; }
.toolbar {
  position: sticky; top: 0; z-index: 100; background: #1c2431; color: #fff;
  padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
}
.toolbar h1 { font-size: 14px; font-weight: 600; margin: 0; }
.toolbar select { font-size: 13px; padding: 7px 10px; border-radius: 4px; border: 1px solid #444; background: #262f3d; color: #fff; min-width: 260px; }
.toolbar button {
  background: #d8be86; color: #1c2431; border: none; border-radius: 4px;
  padding: 9px 18px; font-weight: 700; font-size: 13px; cursor: pointer;
}
.toolbar button:hover { background: #c9a961; }
#report-warning { display:none; margin: 12px 24px 0; padding: 10px 14px; border: 1px solid rgba(208,128,99,.4); border-radius: 4px; background: rgba(208,128,99,.08); color: #b5573a; font-size: 13px; line-height: 1.5; }
#report-warning.show { display:block; }
#report-warning ul { margin: 6px 0 0 18px; padding: 0; }
.scroll-area { padding: 24px 0 60px; }
/* ============================================================
   Property Launch Deck — browser module CSS
   Ported 1:1 from deck-system/template/style.css + deck.html.j2's
   inline page CSS. Same class names, same values — keep both in
   sync if you tweak one.

   FONTS: loaded via Google Fonts CDN below. If dubai-realestate-
   agent.html needs to work fully offline, swap this @import for
   base64-embedded @font-face rules instead (ask and I'll generate
   them — adds ~1.5MB to the file).
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,500&family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap');

:root {
  --navy-950: #13213b;
  --navy-900: #182946;
  --navy-800: #1c3355;
  --navy-700: #274468;
  --gold: #d8be86;
  --gold-deep: #b5893a;
  --cream: #f5f2ea;
  --cream-chip: #ede9de;
  --cream-line: #ddd3bc;
  --paper: #ffffff;
  --ink: #16232f;
  --ink-soft: #4c5964;
  --ink-faint: #8993a0;
  --rule: #e4e2dc;
}

#deck-report * { box-sizing: border-box; margin: 0; padding: 0; }
#deck-report { font-family: 'Inter', sans-serif; color: var(--ink); }

/* ---- On-screen preview: pages stacked with a light gap + shadow.
   Print mode strips this down to exact page boxes (see @media print). ---- */
#deck-report .page {
  width: 13.333in;
  height: 7.5in;
  position: relative;
  overflow: hidden;
  background: var(--paper);
  margin: 0 auto 24px auto;
  box-shadow: 0 4px 24px rgba(0,0,0,0.14);
}

#deck-report .eyebrow {
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 10.5pt;
  letter-spacing: 2.2px;
  text-transform: uppercase;
  color: var(--gold-deep);
}
#deck-report .eyebrow.on-dark { color: var(--gold); }

#deck-report .footer {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 0.4in;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 0.45in;
  font-size: 8pt;
  color: var(--ink-faint);
  border-top: 1px solid var(--rule);
  letter-spacing: 0.4px;
  background: var(--paper);
}
#deck-report .footer .pageno { font-weight: 600; letter-spacing: 1px; }

#deck-report img.ph, #deck-report div.ph {
  background: linear-gradient(135deg, #e9e4d8 0%, #ddd6c4 100%);
  border: 1px dashed #b9ae92;
  color: #8a7f63;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-family: 'Inter', sans-serif;
  font-size: 9pt;
  font-weight: 600;
  letter-spacing: 0.3px;
  padding: 0.15in;
  line-height: 1.4;
}

#deck-report table { border-collapse: collapse; width: 100%; }

#deck-report .icon-badge {
  width: 0.5in; height: 0.5in;
  border-radius: 999px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

/* ===== Page 1 — Cover ===== */
#deck-report .cover { display: flex; }
#deck-report .cover .sidebar {
  width: 5.35in; height: 7.5in; background: var(--navy-950);
  color: #fff; padding: 0.36in 0.42in 0 0.42in; position: relative;
}
#deck-report .cover .hero { flex: 1; height: 7.5in; position: relative; overflow: hidden; background: #dcdcdc; }
#deck-report .cover .hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
#deck-report .cover .watermark {
  position: absolute; top: 42%; left: 50%;
  transform: translate(-50%,-50%) rotate(-32deg);
  font-family: 'Playfair Display'; font-style: italic; font-weight: 400;
  font-size: 46pt; color: rgba(255,255,255,0.22);
  white-space: nowrap; letter-spacing: 1px;
}
#deck-report .presented-by { display: flex; align-items: center; gap: 0.15in; margin-bottom: 0.2in; }
#deck-report .presented-by .meta .name { font-size: 13.5pt; font-weight: 700; margin-top: 1px; }
#deck-report .presented-by .meta .handle { font-size: 8.8pt; color: var(--gold); font-weight: 600; display:flex; align-items:center; gap:5px; margin-top: 1px;}
#deck-report .cover hr.rule { border: none; border-top: 1px solid rgba(255,255,255,0.16); margin: 0.16in 0; }
#deck-report .cover .tag { color: var(--gold); font-size: 9.5pt; font-weight: 700; letter-spacing: 2.4px; }
#deck-report .cover .project-name { font-family: 'Playfair Display'; font-style: italic; font-weight: 400; font-size: 52pt; line-height: 1.02; margin: 0.06in 0 0.1in 0; }
#deck-report .cover .locality { font-size: 12pt; font-weight: 700; letter-spacing: 2.2px; }
#deck-report .cover .plot { font-family: 'Playfair Display'; font-style: italic; color: #a9b7c9; font-size: 10.5pt; margin-top: 0.05in; }
#deck-report .cover .stats { margin-top: 0.02in; }
#deck-report .cover .stat-row { display: flex; align-items: center; gap: 0.16in; padding: 0.105in 0; }
#deck-report .cover .stat-row .icon-badge { background: var(--navy-800); width: 0.46in; height: 0.46in; }
#deck-report .cover .stat-row .stat-value { font-size: 14pt; font-weight: 800; line-height: 1.15; }
#deck-report .cover .stat-row .stat-label { font-size: 8.2pt; color: #a9b7c9; line-height: 1.35; margin-top: 1px; max-width: 3.5in; }
#deck-report .cover .price-box {
  margin-top: 0.14in; border: 1px solid var(--gold); border-radius: 3px;
  padding: 0.13in 0.2in; display: flex; align-items: baseline; justify-content: space-between;
}
#deck-report .cover .price-box .label { font-size: 8.4pt; letter-spacing: 1.6px; color: #a9b7c9; font-weight: 700; }
#deck-report .cover .price-box .value { font-family: 'Playfair Display'; font-weight: 600; font-size: 18pt; color: var(--gold); }

/* ===== Page 2 — Investment case ===== */
#deck-report .p2 { padding: 0.42in 0.5in 0 0.5in; }
#deck-report .p2 .headline { font-family:'Playfair Display'; font-weight:600; font-size: 27pt; color: var(--navy-950); }
#deck-report .p2 .subhead { font-family:'Playfair Display'; font-style: italic; color: var(--ink-soft); font-size: 12.5pt; margin-top: 0.03in; }
#deck-report .p2 .body { display:flex; gap: 0.4in; margin-top: 0.22in; }
#deck-report .p2 .col-left { width: 5.9in; flex: 0 0 5.9in; min-width: 0; }
#deck-report .p2 .col-right { width: 3.55in; flex: 0 0 3.55in; min-width: 0; }

#deck-report .p2 table.unit-table { font-size: 9.3pt; table-layout: fixed; width: 100%; }
#deck-report .p2 table.unit-table thead th {
  background: var(--navy-900); color:#fff; font-weight:600; text-align:left;
  padding: 0.09in 0.12in; font-size: 8.8pt;
}
#deck-report .p2 table.unit-table thead th.num, #deck-report .p2 table.unit-table td.num { text-align: right; }
#deck-report .p2 table.unit-table tbody td { padding: 0.09in 0.12in; border-bottom: 1px solid var(--rule); color: var(--ink); }
#deck-report .p2 table.unit-table tbody tr.hi { background: var(--cream); }
#deck-report .p2 table.unit-table tbody tr.hi td:first-child { font-weight: 700; }
#deck-report .p2 .star { color: var(--gold-deep); }
#deck-report .p2 .table-foot { font-size: 8pt; font-style: italic; color: var(--ink-faint); margin-top: 0.07in; }

#deck-report .p2 .pp-title { font-size: 9.5pt; font-weight: 800; letter-spacing: 1.6px; margin-top: 0.22in; color: var(--navy-950); }
#deck-report .p2 .pp-row { display:flex; gap: 0.09in; margin-top: 0.1in; }
#deck-report .p2 .pp-chip { flex:1; background: var(--cream); border-radius: 3px; text-align:center; padding: 0.11in 0.03in 0.08in; }
#deck-report .p2 .pp-chip.final { background: var(--gold); }
#deck-report .p2 .pp-chip .pct { font-weight: 800; font-size: 12.5pt; color: var(--navy-950); }
#deck-report .p2 .pp-chip .when { font-size: 6.6pt; color: var(--ink-faint); margin-top: 0.02in; }
#deck-report .p2 .pp-note { font-size: 7.6pt; color: var(--ink-faint); margin-top: 0.08in; }

#deck-report .p2 .metrics-row { display:flex; gap: 0.22in; margin-top: 0.2in; }
#deck-report .p2 .metric-box { flex:1; background: var(--cream); border-radius: 3px; padding: 0.16in 0.18in; }
#deck-report .p2 .metric-box .val { font-family:'Playfair Display'; font-weight:700; font-size: 20pt; color: var(--navy-950); }
#deck-report .p2 .metric-box .lbl { font-size: 7.6pt; color: var(--ink-soft); margin-top: 0.03in; line-height:1.35; }
#deck-report .p2 .trend-box { flex:1.3; }
#deck-report .p2 .trend-title { font-size: 7.6pt; color: var(--ink-soft); text-align:right; margin-bottom: 0.04in; }

#deck-report .p2 .side-panel { background: var(--navy-950); color:#fff; border-radius: 4px; padding: 0.22in 0.24in 0.2in; }
#deck-report .p2 .side-panel .title { font-family:'Playfair Display'; font-weight:700; font-size: 15.5pt; line-height:1.3; margin-top: 0.06in; }
#deck-report .p2 .side-panel .fig { margin-top: 0.14in; border-radius: 3px; overflow:hidden; }
#deck-report .p2 .side-panel .fig img { width:100%; display:block; }
#deck-report .p2 .side-panel .cap { font-size: 7.3pt; font-style: italic; color: #9fb0c4; margin-top: 0.06in; }
#deck-report .p2 .side-panel .hl { font-size: 9pt; line-height: 1.5; margin-top: 0.16in; color: #dbe3ec; }
#deck-report .p2 .side-panel .hl b { color: var(--gold); }
#deck-report .p2 .side-panel .note { font-size: 8.3pt; line-height: 1.5; color: #9fb0c4; margin-top: 0.14in; padding-top:0.14in; border-top: 1px solid rgba(255,255,255,0.16); }
#deck-report .p2 .note b { color: #fff; }

/* ===== Page 3 — Masterplan / Districts ===== */
#deck-report .p3-hero {
  height: 1.7in; position: relative; overflow: hidden;
  background: linear-gradient(135deg, #384457 0%, #1c2431 100%);
  color: #fff; display:flex; flex-direction:column; justify-content:center;
  padding: 0 0.5in;
}
#deck-report .p3-hero img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
#deck-report .p3-hero .scrim { position:absolute; inset:0; background: linear-gradient(90deg, rgba(12,17,26,0.72) 0%, rgba(12,17,26,0.42) 65%, rgba(12,17,26,0.5) 100%); z-index:1; }
#deck-report .p3-hero .inner { position:relative; z-index:2; max-width: 9in; }
#deck-report .p3-hero .eyebrow { color: #cfd8e3; }
#deck-report .p3-hero h1 { font-family:'Playfair Display'; font-weight:700; font-size: 21pt; line-height:1.28; margin-top: 0.06in; }

#deck-report .p3-body { padding: 0.2in 0.5in 0 0.5in; }
#deck-report .p3 .cols { display:flex; gap: 0.4in; }
#deck-report .p3 .col-map { flex: 0 0 3.5in; min-width: 0; }
#deck-report .p3 .col-jewels { flex: 1; min-width: 0; }
#deck-report .p3 .map-img { height: 1.25in; border-radius: 3px; overflow:hidden; border: 1px solid var(--rule); }
#deck-report .p3 .map-img img { width:100%; height:100%; object-fit:cover; display:block; }
#deck-report .p3 .districts-title { font-family:'Playfair Display'; font-weight:700; font-size: 14.5pt; color: var(--navy-950); margin-top: 0.13in; }
#deck-report .p3 .districts-body { font-size: 8.4pt; color: var(--ink-soft); line-height: 1.5; margin-top: 0.05in; }
#deck-report .p3 .live-today { font-size: 8.2pt; color: var(--ink); margin-top: 0.1in; }
#deck-report .p3 .live-today b { font-weight:700; }
#deck-report .p3 .note-gold { font-size: 8.2pt; color: var(--gold-deep); font-weight: 700; margin-top: 0.04in; }

#deck-report .p3 .jewels-intro { font-size: 8.6pt; color: var(--ink-soft); line-height: 1.5; margin-top: 0.05in; }
#deck-report .p3 .jewels-grid { display:grid; grid-template-columns: repeat(3, 1fr); row-gap: 0.13in; column-gap: 0.2in; margin-top: 0.16in; }
#deck-report .p3 .jewel-item { display:flex; align-items:center; gap: 0.09in; font-size: 9.5pt; font-weight: 600; color: var(--navy-950); }
#deck-report .p3 .jewel-item svg { flex-shrink:0; }

#deck-report .p3 .district-cards { display:flex; gap: 0.22in; margin-top: 0.15in; }
#deck-report .p3 .district-card { flex:1; background: var(--cream); border-radius: 3px; padding: 0.12in 0.16in; min-width:0; }
#deck-report .p3 .district-card h4 { font-size: 8.6pt; font-weight: 800; letter-spacing: 1px; color: var(--gold-deep); }
#deck-report .p3 .district-card p { font-size: 8pt; color: var(--ink-soft); line-height: 1.45; margin-top: 0.05in; }

#deck-report .p3 .around-title { font-size: 9.5pt; font-weight:800; letter-spacing:1.6px; color: var(--navy-950); margin-top: 0.13in; }
#deck-report .p3 .around-row { display:flex; gap: 0.45in; margin-top: 0.08in; align-items:center; }
#deck-report .p3 .around-item { display:flex; align-items:center; gap: 0.12in; }
#deck-report .p3 .around-item .badge { width:0.42in; height:0.42in; border-radius:999px; background:var(--cream); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
#deck-report .p3 .around-item .num { font-weight: 800; font-size: 15pt; color: var(--navy-950); line-height:1; }
#deck-report .p3 .around-item .lbl { font-size: 7.4pt; color: var(--ink-soft); margin-top:1px; max-width: 1.7in; line-height:1.3; white-space: nowrap; }
#deck-report .p3 .around-caption { font-size: 7.4pt; font-style: italic; color: var(--ink-faint); margin-top: 0.1in; }

/* ===== Page 4 — Comparables ===== */
#deck-report .p4 { padding: 0.42in 0.5in 0 0.5in; }
#deck-report .p4 .headline { font-family:'Playfair Display'; font-weight:600; font-size: 25pt; color: var(--navy-950); }
#deck-report .p4 .subhead { font-family:'Playfair Display'; font-style: italic; color: var(--ink-soft); font-size: 11.5pt; margin-top: 0.03in; }
#deck-report .p4 .body { display:flex; gap: 0.4in; margin-top: 0.2in; }
#deck-report .p4 .col-left { flex: 0 0 5.9in; min-width: 0; }
#deck-report .p4 .col-right { flex: 0 0 3.55in; min-width: 0; }

#deck-report .p4 table.comp-table { font-size: 9.2pt; table-layout: fixed; width:100%; }
#deck-report .p4 table.comp-table thead th { background: var(--navy-900); color:#fff; font-weight:600; text-align:left; padding: 0.09in 0.14in; font-size: 8.6pt; }
#deck-report .p4 table.comp-table tbody td { padding: 0.1in 0.14in; border-bottom: 1px solid var(--rule); color: var(--ink); }
#deck-report .p4 table.comp-table tbody tr.hi td { background: var(--navy-950); color: #fff; font-weight: 700; }
#deck-report .p4 table.comp-table tbody tr.hi td.val { color: var(--gold); font-family:'Playfair Display'; font-size: 12pt; }
#deck-report .p4 table.comp-table td.num { text-align:center; }

#deck-report .p4 .table-note { font-size: 7.8pt; font-style: italic; color: var(--ink-faint); margin-top: 0.09in; }

#deck-report .p4 .bar-title { font-size: 9.3pt; font-weight: 800; letter-spacing: 1.4px; color: var(--navy-950); margin-top: 0.2in; }
#deck-report .p4 .bar-chart { margin-top: 0.08in; }

#deck-report .p4 .calc-block { margin-top: 0.13in; padding: 0.1in 0.14in; border: 1px solid var(--cream-line); border-left: 3px solid var(--gold-deep); border-radius: 3px; background: var(--cream); }
#deck-report .p4 .calc-label { font-size: 6.8pt; font-weight: 800; letter-spacing: 1.2px; color: var(--gold-deep); }
#deck-report .p4 .calc-headline { font-family:'Playfair Display'; font-weight:700; font-size: 12pt; color: var(--navy-950); margin-top: 0.02in; }
#deck-report .p4 .calc-sub { font-size: 7.6pt; color: var(--ink-soft); margin-top: 0.01in; }
#deck-report .p4 .calc-note { font-size: 7pt; color: var(--ink-faint); line-height: 1.35; margin-top: 0.05in; }

#deck-report .p4 .opp-panel { background: var(--cream); border-radius: 4px; padding: 0.24in 0.26in; }
#deck-report .p4 .opp-panel .eyebrow { margin-top: 0; }
#deck-report .p4 .opp-stat { margin-top: 0.16in; }
#deck-report .p4 .opp-stat:first-of-type { margin-top: 0.14in; }
#deck-report .p4 .opp-stat .num { font-family:'Playfair Display'; font-weight: 700; font-size: 25pt; color: var(--navy-950); line-height:1; }
#deck-report .p4 .opp-stat .body { font-size: 8.4pt; color: var(--ink-soft); line-height: 1.5; margin-top: 0.06in; }
#deck-report .p4 .opp-rule { border:none; border-top: 1px solid var(--cream-line); margin: 0.18in 0; }
#deck-report .p4 .opp-note { font-size: 8.4pt; color: var(--ink-soft); line-height: 1.55; }
#deck-report .p4 .opp-note b { color: var(--navy-950); }

/* ===== Page 5 — Location & Lifestyle ===== */
#deck-report .p5 { padding: 0.4in 0.5in 0 0.5in; }
#deck-report .p5 .headline { font-family:'Playfair Display'; font-weight:600; font-size: 25pt; color: var(--navy-950); }
#deck-report .p5 .subhead { font-family:'Playfair Display'; font-style: italic; color: var(--ink-soft); font-size: 11.5pt; margin-top: 0.03in; }

#deck-report .p5 .hero-imgs { display:flex; gap: 0.22in; margin-top: 0.18in; }
#deck-report .p5 .mall-col { flex: 0 0 7.1in; min-width:0; }
#deck-report .p5 .map-col { flex: 1; min-width: 0; }
#deck-report .p5 .mall-img, #deck-report .p5 .map-img { height: 1.7in; border-radius: 3px; overflow:hidden; position:relative; border: 1px solid var(--rule); }
#deck-report .p5 .mall-img img, #deck-report .p5 .map-img img { width:100%; height:100%; object-fit:cover; display:block; }
#deck-report .p5 .mall-img .cap {
  position:absolute; left:0; right:0; bottom:0; background: rgba(12,17,26,0.74); color:#fff;
  font-size: 8.4pt; font-style: italic; padding: 0.07in 0.15in;
}
#deck-report .p5 .mall-stats { display:flex; gap: 0.5in; margin-top: 0.15in; }
#deck-report .p5 .mall-stats .stat .val { font-family:'Playfair Display'; font-weight:700; font-size: 16pt; color: var(--gold-deep); }
#deck-report .p5 .mall-stats .stat .lbl { font-size: 7.6pt; color: var(--ink-soft); margin-top:1px; }
#deck-report .p5 .map-caption { font-size: 7.6pt; font-style: italic; color: var(--ink-faint); margin-top: 0.08in; }

#deck-report .p5 .bottom-band { display:flex; gap: 0.3in; margin-top: 0.16in; }
#deck-report .p5 .nearby-panel { flex:1; background: var(--cream); border-radius: 4px; padding: 0.14in 0.22in; min-width:0; }
#deck-report .p5 .nearby-item { display:flex; align-items:center; gap: 0.14in; padding: 0.05in 0; }
#deck-report .p5 .nearby-item .badge { width:0.36in; height:0.36in; border-radius:999px; background:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
#deck-report .p5 .nearby-item .txt { font-size: 9.3pt; color: var(--ink); }
#deck-report .p5 .nearby-item .txt b { color: var(--navy-950); font-weight:800; }
#deck-report .p5 .contact-card {
  flex: 0 0 2.9in; border: 1px solid var(--rule); border-radius: 4px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  padding: 0.2in;
}
#deck-report .p5 .contact-card .name { font-weight:800; font-size: 11.5pt; color: var(--navy-950); margin-top: 0; }

/* ===== Page 6 — Investment Returns ===== */
#deck-report .p6 { padding: 0.42in 0.5in 0 0.5in; }
#deck-report .p6 .headline { font-family:'Playfair Display'; font-weight:600; font-size: 25pt; color: var(--navy-950); }
#deck-report .p6 .subhead { font-family:'Playfair Display'; font-style: italic; color: var(--ink-soft); font-size: 11.5pt; margin-top: 0.03in; }
#deck-report .p6 .body { display:flex; gap: 0.4in; margin-top: 0.2in; }
#deck-report .p6 .col-left { flex: 0 0 5.9in; min-width: 0; }
#deck-report .p6 .col-right { flex: 0 0 3.55in; min-width: 0; }

/* ============================================================
   Print / PDF export
   Chrome's "Save as PDF" respects @page size exactly, so the
   printed PDF comes out at true 13.333x7.5in per page with real
   vector text (not a rasterized screenshot).
   ============================================================ */
@media print {
  @page { size: 13.333in 7.5in; margin: 0; }
  html, body { background: #fff !important; }
  /* Hide everything that isn't the report itself. #deck-report stays in
     normal document flow (no position:absolute) so its 5 .page children
     paginate the ordinary way — more reliably across print/PDF engines
     than the old hide-and-reposition trick this block used to use.
     If embedding this CSS in an app shell, add that shell's chrome
     selectors (nav bars, headers, toolbars) to the hide-list below. */
  #deck-report .page {
    margin: 0; box-shadow: none;
    break-after: page; page-break-after: always;
  }
  #deck-report .page:last-child { break-after: avoid; page-break-after: avoid; }
  .no-print { display: none !important; }
}

<script>
// SVG chart generators — ported 1:1 from template/charts.py.

function lineTrend(points, { width = 300, height = 90, color = "#c9a15a", axisColor = "#8993a0" } = {}) {
  const n = points.length;
  if (n < 2) return "";
  const padL = 26, padR = 26, padT = 22, padB = 18;
  const plotW = width - padL - padR;
  const plotH = height - padT - padB;
  const vals = points.map((p) => p.value);
  const vmin = Math.min(...vals);
  const vmax = Math.max(...vals);
  const vspan = (vmax - vmin) || 1;
  const xs = points.map((_, i) => padL + (i / (n - 1)) * plotW);
  const ys = vals.map((v) => padT + plotH - ((v - vmin) / vspan) * plotH);

  const path = xs.map((x, i) => `${i === 0 ? "M" : "L"} ${x.toFixed(1)} ${ys[i].toFixed(1)}`).join(" ");
  const dots = xs.map((x, i) => `<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="2.6" fill="${color}"/>`).join("");
  const anchors = n > 2 ? ["start", ...Array(n - 2).fill("middle"), "end"] : ["start", "end"];
  const labelsV = xs
    .map((x, i) => `<text x="${x.toFixed(1)}" y="${(ys[i] - 8).toFixed(1)}" font-size="9" font-weight="700" fill="#16232f" text-anchor="${anchors[i]}" font-family="Inter">${vals[i].toLocaleString()}</text>`)
    .join("");
  const labelsX = xs
    .map((x, i) => `<text x="${x.toFixed(1)}" y="${height - 4}" font-size="7.6" fill="${axisColor}" text-anchor="${anchors[i]}" font-family="Inter">${points[i].label}</text>`)
    .join("");

  return `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg"><path d="${path}" fill="none" stroke="${color}" stroke-width="2"/>${dots}${labelsV}${labelsX}</svg>`;
}

function barH(items, { width = 380, rowH = 26, color = "#13213b", track = "#ede9de", highlightColor = "#c9a15a" } = {}) {
  const n = items.length;
  const height = n * rowH;
  const vmax = Math.max(...items.map((i) => i.value)) || 1;
  const labelW = 78, valW = 46;
  const barMax = width - labelW - valW - 8;

  const rows = items
    .map((item, i) => {
      const y = i * rowH;
      const bw = Math.max(4, (item.value / vmax) * barMax);
      const fill = item.highlight ? highlightColor : color;
      const display = item.display ?? item.value;
      return (
        `<text x="0" y="${y + rowH / 2 + 3}" font-size="9.5" fill="#16232f" font-family="Inter" font-weight="600">${item.label}</text>` +
        `<rect x="${labelW}" y="${(y + rowH * 0.22).toFixed(1)}" width="${barMax}" height="${(rowH * 0.56).toFixed(1)}" rx="2" fill="${track}"/>` +
        `<rect x="${labelW}" y="${(y + rowH * 0.22).toFixed(1)}" width="${bw.toFixed(1)}" height="${(rowH * 0.56).toFixed(1)}" rx="2" fill="${fill}"/>` +
        `<text x="${labelW + barMax + 8}" y="${y + rowH / 2 + 3}" font-size="9.5" fill="#16232f" font-family="Inter" font-weight="700">${display}</text>`
      );
    })
    .join("");

  return `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg">${rows}</svg>`;
}

if (typeof module !== "undefined") module.exports = { lineTrend, barH };

</script>
<script>
// ============================================================
// CALC / VALIDATE — the analytical layer between raw project data
// and the renderer. Nothing here is presentation logic; it only
// computes numbers and flags data problems. Pure functions, no DOM.
//
// Design principle (per the spec this was built against): keep a
// hard line between
//   SOURCE data      — what the project data literally states
//   CALCULATED data  — arithmetic on source data (psf, % diff)
//   ANALYSIS         — a conclusion drawn from calculated data
//   ASSUMPTION       — anything modeled/estimated, always labeled
// The renderer is responsible for labeling calculated/analysis
// content as such when it displays it — this file just produces
// the numbers and never invents one it can't derive from the data.
// ============================================================

function toNumber(v) {
  if (typeof v === "number") return v;
  if (!v) return null;
  const s = String(v).trim();
  // Handle "AED 2.14M" / "2.14M" / "AED 1.97 Million" style magnitude
  // suffixes explicitly — a naive digit-strip would silently turn
  // "2.14M" into 2.14 and be wrong by six orders of magnitude.
  const m = s.match(/([\d,.]+)\s*(million|m\b|k\b|thousand)?/i);
  if (!m) return null;
  let n = parseFloat(m[1].replace(/,/g, ""));
  if (!Number.isFinite(n)) return null;
  const suffix = (m[2] || "").toLowerCase();
  if (suffix.startsWith("m")) n *= 1_000_000;
  else if (suffix.startsWith("k") || suffix.startsWith("t")) n *= 1_000;
  return n;
}

/**
 * Per-unit-type metrics derived from the unit table. Prefers explicit
 * numeric fields (avgPriceNum, sizeAvgNum, startingNum) when the data
 * provides them — those are unambiguous. Falls back to parsing the
 * display strings (starting/average/size) only when numeric fields
 * are absent, via the magnitude-aware parser above.
 */
function computeUnitMetrics(unitTable) {
  return (unitTable || []).map((u) => {
    const price = toNumber(u.avgPriceNum) ?? toNumber(u.average) ?? toNumber(u.startingNum) ?? toNumber(u.starting);
    const size = toNumber(u.sizeAvgNum) ?? toNumber(u.sizeMinNum) ?? toNumber(u.size);
    const psf = price && size ? price / size : null;
    return {
      type: u.type,
      units: u.units,
      price,
      size,
      psf,
      psfDisplay: psf ? `AED ${Math.round(psf).toLocaleString()}` : "Data unavailable",
    };
  });
}

/**
 * Best-value scoring across unit types. Lower AED/sq ft and larger
 * average size both score positively; entry price is scored inverse
 * (more accessible = higher score) but weighted lightly, since it's
 * a secondary consideration relative to actual value-for-money.
 * Weights are a plain constant, not hidden magic numbers — change
 * them here if the investment thesis for a project calls for it.
 */
const DEFAULT_SCORE_WEIGHTS = { psf: 0.55, size: 0.25, entryPrice: 0.20 };

function computeBestUnit(unitTable, weights = DEFAULT_SCORE_WEIGHTS) {
  const metrics = computeUnitMetrics(unitTable);
  const scoreable = metrics.filter((m) => m.psf && m.size && m.price);
  if (scoreable.length < 2) {
    return { metrics, winner: null, reason: "Not enough priced unit types to compare." };
  }

  const psfVals = scoreable.map((m) => m.psf);
  const sizeVals = scoreable.map((m) => m.size);
  const priceVals = scoreable.map((m) => m.price);
  const norm = (v, arr, invert) => {
    const min = Math.min(...arr), max = Math.max(...arr);
    if (max === min) return 0.5;
    const n = (v - min) / (max - min);
    return invert ? 1 - n : n;
  };

  let winner = null, bestScore = -Infinity;
  for (const m of scoreable) {
    const score =
      norm(m.psf, psfVals, true) * weights.psf +
      norm(m.size, sizeVals, false) * weights.size +
      norm(m.price, priceVals, true) * weights.entryPrice;
    m.score = score;
    if (score > bestScore) { bestScore = score; winner = m; }
  }

  return { metrics, winner, weights };
}

/**
 * District/market premium-discount, computed only when both sides
 * of the comparison exist in source data. Returns null (not a
 * fabricated %) if district average psf is missing.
 */
function computeDistrictComparison(projectPsf, districtAvgPsf) {
  const p = toNumber(projectPsf);
  const d = toNumber(districtAvgPsf);
  if (!p || !d) return null;
  const diffPct = ((d - p) / d) * 100;
  return {
    projectPsf: p,
    districtAvgPsf: d,
    diffPct: Math.round(diffPct * 10) / 10,
    direction: diffPct > 0 ? "below" : "above",
    display: `${Math.abs(Math.round(diffPct * 10) / 10)}% ${diffPct > 0 ? "below" : "above"} district average`,
  };
}

/**
 * Payment plan validation. Arbitrary number of instalments, any
 * split (20/80, 60/40, 9-tranche construction-linked, whatever).
 * Auto-identifies the final instalment rather than requiring a
 * hand-set flag, and flags the plan if it doesn't sum to 100%.
 */
function validatePaymentPlan(plan) {
  if (!Array.isArray(plan) || plan.length === 0) {
    return { valid: false, total: 0, warning: "No payment plan data provided." };
  }
  const total = plan.reduce((sum, p) => sum + (toNumber(p.pct) ?? 0), 0);
  const rounded = Math.round(total * 10) / 10;
  const valid = Math.abs(rounded - 100) < 0.1;
  return {
    valid,
    total: rounded,
    warning: valid ? null : `Payment plan instalments sum to ${rounded}%, not 100% — check the source data before sending this report out.`,
  };
}

/**
 * Full project-data validation. Returns a list of human-readable
 * warnings; an empty list means the report is safe to render and
 * export as-is. Never throws — a malformed project should degrade
 * to "here's what's wrong," not a broken page.
 */
function validateProjectData(data) {
  const warnings = [];
  const req = (val, label) => { if (!val) warnings.push(`Missing ${label}.`); };

  req(data?.project?.name, "project name");
  req(data?.project?.location, "location");
  req(data?.agent?.name, "presenter name");

  const units = data?.page2?.unit_table;
  if (!units || units.length === 0) {
    warnings.push("No unit types defined — pages 2 and 4 will show as empty.");
  } else {
    units.forEach((u, i) => {
      if (!u.type) warnings.push(`Unit row ${i + 1} is missing a type label.`);
      if (!u.starting && !u.average) warnings.push(`"${u.type || "Unit row " + (i + 1)}" has no price data.`);
    });
  }

  const pp = validatePaymentPlan(data?.page2?.payment_plan);
  if (pp.warning) warnings.push(pp.warning);

  return { warnings, paymentPlan: pp };
}

if (typeof module !== "undefined") {
  module.exports = {
    toNumber,
    computeUnitMetrics,
    computeBestUnit,
    computeDistrictComparison,
    validatePaymentPlan,
    validateProjectData,
    DEFAULT_SCORE_WEIGHTS,
  };
}

</script>
<script>
// Renders the 5-page property launch deck as an HTML string, given a data
// object with the same shape as the Python system's JSON schema.
// Ported 1:1 from deck-system/template/deck.html.j2 — keep class names in
// sync with style.css (also ported, see deck-report.css).

if (typeof module !== "undefined") {
  // Node test harness only — in the browser these come from the
  // preceding <script> tags as globals (ICONS, lineTrend, barH, and
  // now the calc.js exports), same pattern as icons/charts already use.
  var { computeUnitMetrics, computeBestUnit, computeDistrictComparison, validatePaymentPlan, validateProjectData } = require("./calc.js");
}

function esc(s) {
  return (s ?? "").toString();
}

function renderDeck(data) {
  const { agent, project, page2, page3, page4, page5 } = data;
  const footerLeft = data.footer_left;
  const watermark = data.watermark;

  const ph = (label, extraStyle = "") =>
    `<div class="ph" style="width:100%;height:100%;${extraStyle}">[ Insert: ${label} ]</div>`;

  // ---------- PAGE 1 : COVER ----------
  const statRows = project.stats
    .map(
      (s) => `
      <div class="stat-row">
        <div class="icon-badge">${ICONS[s.icon]?.({ color: "#d8be86", size: 20 }) ?? ""}</div>
        <div>
          <div class="stat-value">${esc(s.value)}</div>
          <div class="stat-label">${esc(s.label)}</div>
        </div>
      </div>`
    )
    .join("");

  const page1 = `
<div class="page cover">
  <div class="sidebar">
    <div class="presented-by">
      <div class="meta">
        <div class="name">${esc(agent.name)}</div>
        <div class="handle">${esc(agent.handle)}</div>
      </div>
    </div>
    <hr class="rule">
    <div class="tag">${esc(project.tag)}</div>
    <div class="project-name">${esc(project.name)}</div>
    <div class="locality">${esc(project.location).toUpperCase()}</div>
    <div class="plot">${esc(project.district)}</div>
    <hr class="rule">
    <div class="stats">${statRows}</div>
    <div class="price-box">
      <div class="label">STARTING FROM</div>
      <div class="value">${esc(project.starting_price)}</div>
    </div>
  </div>
  <div class="hero">
    ${project.hero_image ? `<img src="${esc(project.hero_image)}">` : ph("hero render: exterior tower photo/CGI, landscape")}
    ${watermark ? `<div class="watermark">${esc(watermark)} &nbsp; ${esc(watermark)} &nbsp; ${esc(watermark)}</div>` : ""}
  </div>
  <div class="footer">
    <div>${esc(footerLeft)}</div>
    <div class="pageno">01 / LAUNCH OVERVIEW</div>
  </div>
</div>`;

  // ---------- PAGE 2 : INVESTMENT CASE ----------
  const unitRows = page2.unit_table
    .map(
      (r) => `
          <tr class="${r.starred ? "hi" : ""}">
            <td>${esc(r.type)}${r.starred ? ' <span class="star">&#9733;</span>' : ""}</td>
            <td class="num">${esc(r.units)}</td>
            <td class="num">${esc(r.size)}</td>
            <td class="num">${esc(r.starting)}</td>
            <td class="num">${esc(r.average)}</td>
            <td class="num">${esc(r.max)}</td>
          </tr>`
    )
    .join("");

  const ppChips = page2.payment_plan
    .map((p, i) => {
      const pctDisplay = typeof p.pct === "number" ? `${p.pct}%` : esc(p.pct);
      const isFinal = p.final || i === page2.payment_plan.length - 1;
      return `
        <div class="pp-chip ${isFinal ? "final" : ""}">
          <div class="pct">${pctDisplay}</div>
          <div class="when">${esc(p.when)}</div>
        </div>`;
    })
    .join("");

  const page2Html = `
<div class="page p2">
  <div class="headline">${esc(page2.headline)}</div>
  <div class="subhead">${esc(page2.subhead)}</div>
  <div class="body">
    <div class="col-left">
      <table class="unit-table">
        <colgroup>
          <col style="width:27%"><col style="width:11%"><col style="width:17%">
          <col style="width:15%"><col style="width:15%"><col style="width:15%">
        </colgroup>
        <thead>
          <tr>
            <th>Type</th><th class="num">Units</th><th class="num">Size (sq ft)</th>
            <th class="num">Starting</th><th class="num">Average</th><th class="num">Max</th>
          </tr>
        </thead>
        <tbody>${unitRows}</tbody>
      </table>
      <div class="table-foot">${esc(page2.table_foot)}</div>

      <div class="pp-title">PAYMENT PLAN</div>
      <div class="pp-row">${ppChips}</div>
      <div class="pp-note">${esc(page2.payment_note)}</div>

async function getProjects() {
  return Object.entries(PROJECT_STORE).map(([id, p]) => ({ id, label: p.label }));
}
async function getProject(id) {
  return PROJECT_STORE[id]?.data ?? null;
}

async function initProjectReport() {
  const projects = await getProjects();
  const select = document.getElementById('report-project-select');
  select.innerHTML = projects.map(p => `<option value="${p.id}">${p.label}</option>`).join('');
  select.addEventListener('change', (e) => renderReport(e.target.value));
  renderReport(projects[0].id);
}

async function renderReport(key) {
  const data = await getProject(key);
  if (!data) return;
  const { warnings } = validateProjectData(data);
  const box = document.getElementById('report-warning');
  if (warnings.length) {
    box.innerHTML = `<b>Data quality — ${warnings.length} issue${warnings.length > 1 ? 's' : ''}:</b><ul>${warnings.map(w => `<li>${w}</li>`).join('')}</ul>`;
    box.classList.add('show');
  } else {
    box.classList.remove('show'); box.innerHTML = '';
  }
  document.getElementById('deck-report').innerHTML = renderDeck(data);
}

initProjectReport();
